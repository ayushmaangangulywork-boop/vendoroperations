<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>FIIRS — FMCG Inventory Intelligence & Replenishment System</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090b;--bg2:#0f1117;--bg3:#161b24;--bg4:#1c2230;--bg5:#222a38;
  --bo:#252d3d;--bo2:#2f3a50;
  --t1:#f0f2f6;--t2:#8b93a8;--t3:#4e5870;
  --ac:#10e8b8;--ac2:#0090f0;
  --red:#f04438;--green:#22c55e;--yel:#f5c518;--org:#f97316;--pur:#a855f7;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--t1);font-family:var(--font);font-size:13px;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--bo2);border-radius:4px}

/* ── LOGIN ── */
.lp{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#071a28,var(--bg) 70%)}
.lc{background:var(--bg2);border:1px solid var(--bo);border-radius:16px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.licon{width:56px;height:56px;background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px}
.ltitle{font-size:22px;font-weight:700;text-align:center;margin-bottom:3px}
.lsub{font-size:12px;color:var(--t3);text-align:center;margin-bottom:28px}
.lfield{margin-bottom:14px}
.llabel{display:block;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-bottom:5px}
.linput{width:100%;background:var(--bg3);border:1px solid var(--bo);border-radius:8px;padding:11px 14px;color:var(--t1);font-family:var(--font);font-size:13px;outline:none;transition:border .15s}
.linput:focus{border-color:var(--ac)}
.lbtn{width:100%;background:linear-gradient(135deg,var(--ac),#0ad4a0);color:#000;border:none;border-radius:8px;padding:12px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:opacity .15s}
.lbtn:hover{opacity:.88}
.lerr{background:rgba(240,68,56,.1);border:1px solid rgba(240,68,56,.3);border-radius:8px;padding:10px;font-size:12px;color:#f87171;margin-top:10px;text-align:center}
.lhint{background:rgba(16,232,184,.05);border:1px solid rgba(16,232,184,.2);border-radius:8px;padding:10px 14px;margin-top:14px;font-size:11px;color:var(--t3);line-height:1.7}
.lhint code{background:var(--bg4);padding:1px 5px;border-radius:3px;font-family:var(--mono);color:var(--ac)}

/* ── APP LAYOUT ── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--bo);display:flex;flex-direction:column;overflow-y:auto}
.sb-brand{padding:18px 16px 14px;border-bottom:1px solid var(--bo)}
.sb-logo{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ac);letter-spacing:2.5px}
.sb-name{font-size:13.5px;font-weight:700;color:var(--t1);margin-top:3px;line-height:1.3}
.sb-co{font-size:10.5px;color:var(--t3);margin-top:2px}
.sb-section{font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--t3);padding:16px 16px 5px}
.sb-item{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;color:var(--t2);font-size:12.5px;border-left:3px solid transparent;transition:all .15s;user-select:none}
.sb-item:hover{background:var(--bg3);color:var(--t1)}
.sb-item.active{background:var(--bg3);color:var(--ac);border-left-color:var(--ac)}
.sb-icon{width:16px;text-align:center;font-style:normal;flex-shrink:0}
.sb-badge{margin-left:auto;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.sb-foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--bo);font-size:10.5px;color:var(--t3);line-height:1.6}

/* ── MAIN ── */
.main-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--bg2);border-bottom:1px solid var(--bo);padding:0 20px;display:flex;align-items:center;height:52px;gap:10px;flex-shrink:0}
.tb-title{font-size:14px;font-weight:600;flex:1}
.tb-sub{font-size:11px;color:var(--t3)}
.tb-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#000;flex-shrink:0}
.tb-out{background:transparent;border:1px solid var(--bo);color:var(--t3);border-radius:6px;padding:5px 12px;font-size:11px;cursor:pointer;font-family:var(--font);transition:all .15s}
.tb-out:hover{border-color:var(--red);color:var(--red)}
.content{flex:1;overflow-y:auto;padding:20px}

/* ── KPI GRID ── */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px;margin-bottom:20px}
.kcard{background:var(--bg2);border:1px solid var(--bo);border-radius:12px;padding:15px;position:relative;overflow:hidden}
.kcard::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--kc,var(--ac))}
.kcard-label{font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--t3);margin-bottom:8px}
.kcard-val{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1;color:var(--kc,var(--ac))}
.kcard-sub{font-size:10.5px;color:var(--t3);margin-top:5px}

/* ── SECTION HEADER ── */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.sh-t{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--t2)}
.sh-r{display:flex;align-items:center;gap:8px}

/* ── TABLE ── */
.tw{background:var(--bg2);border:1px solid var(--bo);border-radius:12px;overflow:hidden;margin-bottom:18px}
.tw-toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--bo);background:var(--bg3);flex-wrap:wrap}
.tw-count{margin-left:auto;font-size:11px;color:var(--t3);font-family:var(--mono)}
.tw-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
thead tr{border-bottom:1px solid var(--bo)}
th{padding:9px 12px;text-align:left;font-size:10px;font-weight:600;letter-spacing:1px;color:var(--t3);text-transform:uppercase;white-space:nowrap;background:var(--bg3)}
tbody tr{border-bottom:1px solid var(--bo);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg3)}
td{padding:8px 12px;font-size:12px}
.tc{font-family:var(--mono);font-size:11.5px}
.tr{text-align:right}
.tnw{white-space:nowrap}
.bold{font-weight:600}

/* ── FILTERS ── */
.filt{background:var(--bg3);border:1px solid var(--bo);border-radius:6px;padding:6px 10px;color:var(--t1);font-family:var(--font);font-size:12px;outline:none;min-width:130px}
.filt:focus{border-color:var(--ac)}
select.filt option{background:var(--bg3)}
.filt-sm{min-width:90px}

/* ── BADGES ── */
.b{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.b-oos{background:#1f0808;color:#f87171;border:1px solid #7f1d1d}
.b-critical{background:#2a0a0a;color:#ff6b6b;border:1px solid #991b1b}
.b-low{background:#1c1200;color:#fbbf24;border:1px solid #78350f}
.b-healthy{background:#052e16;color:#4ade80;border:1px solid #166534}
.b-over{background:#1a0e2e;color:#c084fc;border:1px solid #7e22ce}
.b-urgent{background:#2a0a0a;color:#ff6b6b;border:1px solid #991b1b}
.b-now{background:#1c1200;color:#fbbf24;border:1px solid #78350f}
.b-review{background:#0a1628;color:#60a5fa;border:1px solid #1e40af}
.b-adequate{background:#052e16;color:#4ade80;border:1px solid #166534}
.b-received{background:#052e16;color:#4ade80;border:1px solid #166534}
.b-pending{background:#1c1200;color:#fbbf24;border:1px solid #78350f}
.b-partial{background:#0a1628;color:#60a5fa;border:1px solid #1e40af}
.b-delayed{background:#1f0808;color:#f87171;border:1px solid #7f1d1d}
.b-excellent{background:#052e16;color:#4ade80;border:1px solid #166534}
.b-good{background:#0e1f18;color:#34d399;border:1px solid #064e3b}
.b-average{background:#1c1200;color:#fbbf24;border:1px solid #78350f}
.b-poor{background:#1f0808;color:#f87171;border:1px solid #7f1d1d}
.b-abc-a{background:#1b2a3b;color:var(--ac);border:1px solid rgba(16,232,184,.3)}
.b-abc-b{background:#1a1030;color:#c084fc;border:1px solid rgba(168,85,247,.3)}
.b-abc-c{background:#1a2010;color:#86efac;border:1px solid rgba(134,239,172,.3)}
.b-dead{background:#2a0808;color:#fca5a5;border:1px solid #7f1d1d}
.b-vslow{background:#1f0a00;color:#fdba74;border:1px solid #9a3412}
.b-slow{background:#0a1628;color:#93c5fd;border:1px solid #1e3a5f}
.b-cat{background:var(--bg4);color:var(--t2);border:1px solid var(--bo);font-size:10px;padding:1px 6px}

/* ── INSIGHTS ── */
.insights-box{background:var(--bg2);border:1px solid var(--bo);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.insights-title{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ac);margin-bottom:12px;font-family:var(--mono)}
.insight-row{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid var(--bo)}
.insight-row:last-child{border-bottom:none}
.insight-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.id-HIGH{background:var(--red)}
.id-MEDIUM{background:var(--yel)}
.id-INFO{background:var(--t3)}
.insight-text{font-size:12.5px;color:var(--t2);line-height:1.5}

/* ── EXCEPTIONS ── */
.ex-item{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--bo)}
.ex-item:last-child{border-bottom:none}
.ex-bar{width:4px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:32px}
.ex-bar-CRITICAL{background:var(--red)}
.ex-bar-HIGH{background:var(--org)}
.ex-bar-MEDIUM{background:var(--ac2)}
.ex-type{font-size:10px;font-weight:700;color:var(--t3);letter-spacing:.8px;text-transform:uppercase}
.ex-desc{font-size:12.5px;color:var(--t1);margin:2px 0;line-height:1.4}
.ex-action{font-size:11.5px;color:var(--t3);font-style:italic}
.ex-sev{margin-left:auto;text-align:right;flex-shrink:0}

/* ── CHARTS ── */
.charts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-bottom:18px}
.chart-box{background:var(--bg2);border:1px solid var(--bo);border-radius:12px;padding:16px}
.chart-box.wide{grid-column:1/-1}
.chart-title{font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--t3);margin-bottom:12px;font-family:var(--mono)}
.chart-wrap{position:relative}

/* ── SUPPLIER CARDS ── */
.sup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-bottom:18px}
.sup-card{background:var(--bg2);border:1px solid var(--bo);border-radius:12px;padding:16px}
.sup-name{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:2px}
.sup-city{font-size:11px;color:var(--t3);margin-bottom:12px}
.sup-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.sup-lbl{font-size:11px;color:var(--t3)}
.sup-val{font-size:12.5px;font-weight:600;color:var(--t1);font-family:var(--mono)}
.prog-wrap{height:5px;background:var(--bg5);border-radius:3px;margin-bottom:10px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}

/* ── ABC BAR ── */
.abc-bar{display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px;margin-bottom:14px}
.abc-seg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}

/* ── REPORT ── */
.report-card{background:var(--bg2);border:1px solid var(--bo);border-radius:12px;padding:18px;cursor:pointer;transition:border-color .2s,box-shadow .2s;margin-bottom:12px}
.report-card:hover{border-color:var(--ac);box-shadow:0 0 0 1px rgba(16,232,184,.1)}
.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:20px}
.rep-icon{font-size:22px;margin-bottom:8px}
.rep-name{font-size:13px;font-weight:600;margin-bottom:4px}
.rep-desc{font-size:11.5px;color:var(--t3);line-height:1.5}
.rep-actions{display:flex;gap:8px;margin-top:12px}

/* ── BUTTONS ── */
.btn{padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:var(--font);transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn-p{background:linear-gradient(135deg,var(--ac),#0ad4a0);color:#000}
.btn-p:hover{opacity:.88}
.btn-g{background:transparent;color:var(--t2);border:1px solid var(--bo)}
.btn-g:hover{border-color:var(--bo2);color:var(--t1)}
.btn-sm{padding:5px 10px;font-size:11px}

/* ── MISC ── */
.empty{text-align:center;padding:36px;color:var(--t3);font-size:12.5px}
.info-bar{background:rgba(0,144,240,.07);border:1px solid rgba(0,144,240,.2);border-radius:8px;padding:10px 14px;font-size:12px;color:#60a5fa;margin-bottom:14px;line-height:1.6}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
@media(max-width:900px){.dg{grid-template-columns:1fr}}
.dc{background:var(--bg2);border:1px solid var(--bo);border-radius:12px;padding:15px}
.dc-t{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-bottom:12px}
.ai{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bo)}
.ai:last-child{border-bottom:none}
.ain{font-family:var(--mono);font-size:15px;font-weight:700}
.score-bar{display:flex;align-items:center;gap:8px}
.score-track{flex:1;height:5px;background:var(--bg5);border-radius:3px;min-width:50px;overflow:hidden}
.score-fill{height:100%;border-radius:3px}
.score-num{font-family:var(--mono);font-size:12px;font-weight:600;min-width:28px}
.col-red{color:var(--red)} .col-grn{color:var(--green)} .col-yel{color:var(--yel)} .col-ac{color:var(--ac)} .col-t3{color:var(--t3)} .col-pur{color:var(--pur)} .col-org{color:var(--org)} .col-ac2{color:var(--ac2)}
</style>
</head>

// ── DETERMINISTIC SEED ────────────────────────────────
const ds=(n)=>{let x=Math.sin(n+1)*43758.5453;x-=Math.floor(x);return x;};
const addDays=(d,n)=>{const dt=new Date(d);dt.setDate(dt.getDate()+n);return dt.toISOString().split("T")[0];};

// ── STOCK SCENARIOS (override for drama) ─────────────
const STOCK_OVERRIDE={
  "BEV-005":0,"SNK-009":0,"DAI-001":0,               // OOS
  "BIS-002":42,"PF-004":38,                           // CRITICAL
  "PC-001":180,"HH-001":160,"GRO-007":190,"BEV-001":150, // LOW
  "BEV-010":800,"BIS-010":720,"HH-009":620,"PF-010":850, // OVERSTOCKED
  "DAI-009":700,"SNK-007":1100,"GRO-009":520,"PC-007":380,
  "BIS-006":1000,"HH-006":500,
};

// ── BUILD INVENTORY ───────────────────────────────────
function buildInv(){
  return SKUS.map((p,pi)=>{
    let qty=STOCK_OVERRIDE.hasOwnProperty(p.sku)?STOCK_OVERRIDE[p.sku]:Math.round(p.tgt*(0.65+ds(pi*7)*0.7));
    const invDays=p.dc>0?+(qty/p.dc).toFixed(1):999;
    let status=qty===0?"OUT OF STOCK":invDays<=3?"CRITICAL":qty<p.rl?"LOW STOCK":qty>p.tgt*1.8?"OVERSTOCKED":"HEALTHY";
    let urgency=qty===0||invDays<=3?"URGENT":invDays<=7?"REPLENISH NOW":qty<p.rl||invDays<=14?"REVIEW":"ADEQUATE";
    const replQty=Math.max(0,p.tgt-qty);
    const sup=SUPPLIERS.find(s=>s.id===p.sup);
    return {...p,supName:sup?.name||"—",qty,invDays,status,replQty,urgency,value:qty*p.cost};
  });
}

// ── BUILD POs ─────────────────────────────────────────
function buildPOs(inv){
  const pos=[];let cnt=100;
  inv.forEach((p,pi)=>{
    const sup=SUPPLIERS.find(s=>s.id===p.sup);
    // 2-4 historical
    const h=2+Math.floor(ds(pi*17)*3);
    for(let i=0;i<h;i++){
      const poDate=addDays(TODAY_STR,-(30+Math.floor(ds(pi*7+i*3)*150)));
      const expDel=addDays(poDate,sup.lead);
      const onT=ds(pi*11+i*7)<sup.rel;
      const actDel=onT?addDays(expDel,Math.floor(ds(pi*13+i)*2)-1):addDays(expDel,2+Math.floor(ds(pi*5+i*11)*8));
      const ord=Math.round(p.tgt*(0.3+ds(pi*3+i)*0.5));
      const fr=onT?0.90+ds(pi+i)*0.10:0.70+ds(pi*2+i)*0.25;
      const rec=Math.min(ord,Math.round(ord*fr));
      pos.push({po:`PO-${cnt++}`,date:poDate,sup:p.sup,supName:sup.name,sku:p.sku,skuName:p.name,cat:p.cat,
        ordered:ord,received:rec,pending:ord-rec,expDel,actDel,cost:p.cost,
        status:rec>=ord?"RECEIVED":"PARTIALLY RECEIVED",
        delay:actDel>expDel?Math.round((new Date(actDel)-new Date(expDel))/86400000):0,
        fillRate:Math.round(rec/ord*100)});
    }
    // 1 open/recent
    if(ds(pi*19)*10<7){
      const poDate=addDays(TODAY_STR,-(2+Math.floor(ds(pi*23)*12)));
      const expDel=addDays(poDate,sup.lead);
      const isPast=expDel<TODAY_STR;
      const isDel=isPast&&ds(pi*29)>sup.rel;
      const ord=Math.round(p.tgt*(0.3+ds(pi*31)*0.5));
      let status="PENDING",actDel=null,rec=0;
      if(isPast&&!isDel){status="RECEIVED";actDel=expDel;rec=ord;}
      else if(isDel){status="DELAYED";}
      pos.push({po:`PO-${cnt++}`,date:poDate,sup:p.sup,supName:sup.name,sku:p.sku,skuName:p.name,cat:p.cat,
        ordered:ord,received:rec,pending:ord-rec,expDel,actDel,cost:p.cost,status,
        delay:isDel?Math.round((new Date(TODAY_STR)-new Date(expDel))/86400000):0,
        fillRate:rec>0?Math.round(rec/ord*100):0});
    }
  });
  return pos.sort((a,b)=>b.date.localeCompare(a.date));
}

// ── BUILD SUPPLIER PERF ───────────────────────────────
function buildSupPerf(pos){
  return SUPPLIERS.map(s=>{
    const sp=pos.filter(p=>p.sup===s.id);
    const total=sp.length;
    if(!total) return null;
    const received=sp.filter(p=>p.status==="RECEIVED").length;
    const delayed=sp.filter(p=>p.status==="DELAYED").length;
    const pending=sp.filter(p=>p.status==="PENDING").length;
    const partial=sp.filter(p=>p.status==="PARTIALLY RECEIVED").length;
    const comp=sp.filter(p=>p.actDel);
    const avgLead=comp.length?+(comp.reduce((s,p)=>(s+(new Date(p.actDel)-new Date(p.date))/86400000),0)/comp.length).toFixed(1):s.lead;
    const fillRate=+(sp.reduce((s,p)=>s+(p.fillRate||0),0)/total).toFixed(1);
    const onTimePct=+(received/total*100).toFixed(1);
    const score=+((onTimePct*0.6)+(fillRate*0.4)).toFixed(1);
    const rating=score>=90?"EXCELLENT":score>=80?"GOOD":score>=70?"AVERAGE":"POOR";
    return {...s,total,received,delayed,pending,partial,onTimePct,fillRate,avgLead,score,rating};
  }).filter(Boolean).sort((a,b)=>b.total-a.total);
}

// ── ABC ───────────────────────────────────────────────
function buildABC(inv){
  const items=[...inv].map(p=>({sku:p.sku,name:p.name,brand:p.brand,cat:p.cat,cost:p.cost,
    consumed:Math.round(p.dc*180),consVal:Math.round(p.dc*180*p.cost)}))
    .sort((a,b)=>b.consVal-a.consVal);
  const total=items.reduce((s,r)=>s+r.consVal,0);
  let cum=0;
  return items.map(r=>{cum+=r.consVal;const cp=+((cum/total)*100).toFixed(1);return{...r,cumPct:cp,abc:cp<=70?"A":cp<=90?"B":"C"};});
}

// ── SLOW MOVING ───────────────────────────────────────
function buildSlow(inv){
  return inv.map((p,i)=>{
    if(p.qty===0) return null;
    const daysSince=p.dc<=8?20+Math.floor(ds(i*7)*55):Math.floor(ds(i*11)*28);
    if(daysSince<30) return null;
    const lastMoved=addDays(TODAY_STR,-daysSince);
    const smStatus=daysSince>=60?"DEAD STOCK":daysSince>=45?"VERY SLOW":"SLOW MOVING";
    return {...p,daysSince,lastMoved,smStatus};
  }).filter(Boolean).sort((a,b)=>b.daysSince-a.daysSince);
}

// ── MONTHLY MOVEMENT ──────────────────────────────────
function buildMonthly(){
  const months=[];const today=new Date();
  const totalDC=SKUS.reduce((s,p)=>s+p.dc,0);
  for(let m=5;m>=0;m--){
    const d=new Date(today.getFullYear(),today.getMonth()-m,1);
    const label=d.toLocaleString("en-IN",{month:"short",year:"2-digit"});
    const days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    const n=0.85+ds(m*7)*0.30;
    months.push({label,sales:Math.round(totalDC*days*n),purchases:Math.round(totalDC*days*n*0.95),returns:Math.round(totalDC*days*0.02)});
  }
  return months;
}

// ── TRANSACTIONS ──────────────────────────────────────
function buildTxns(){
  const txns=[];let cnt=1;
  const locs=LOCATIONS.map(l=>l.id);
  SKUS.forEach((p,pi)=>{
    txns.push({id:`TXN-${String(cnt++).padStart(5,"0")}`,date:addDays(TODAY_STR,-180),sku:p.sku,skuName:p.name,loc:locs[pi%locs.length],locName:LOCATIONS[pi%locs.length].name,type:"PURCHASE",qty:Math.round(p.tgt*0.8),ref:`OPEN-${p.sku}`,sup:p.sup,supName:SUPPLIERS.find(s=>s.id===p.sup)?.name||"",rem:"Opening balance"});
    for(let w=0;w<26;w++){
      const wDate=addDays(TODAY_STR,-(180-w*7));
      const loc=locs[(pi+w)%locs.length];
      const locName=LOCATIONS[(pi+w)%locs.length].name;
      txns.push({id:`TXN-${String(cnt++).padStart(5,"0")}`,date:wDate,sku:p.sku,skuName:p.name,loc,locName,type:"SALE",qty:-Math.round(p.dc*7*(0.6+ds(pi*3+w)*0.8)),ref:`SALE-W${w}`,sup:null,supName:"",rem:"Weekly sales"});
      if(w%2===0) txns.push({id:`TXN-${String(cnt++).padStart(5,"0")}`,date:wDate,sku:p.sku,skuName:p.name,loc,locName,type:"RECEIPT",qty:Math.round(p.tgt*(0.3+ds(pi*11+w)*0.4)),ref:`PO-${100+pi}`,sup:p.sup,supName:SUPPLIERS.find(s=>s.id===p.sup)?.name||"",rem:"PO receipt"});
      if(ds(pi*17+w)<0.05) txns.push({id:`TXN-${String(cnt++).padStart(5,"0")}`,date:wDate,sku:p.sku,skuName:p.name,loc,locName,type:"RETURN",qty:Math.ceil(ds(pi+w)*5)+1,ref:`RET-${cnt}`,sup:null,supName:"",rem:"Customer return"});
      if(ds(pi*29+w)<0.03){const adj=Math.round((ds(pi+w)-0.5)*20);if(adj!==0)txns.push({id:`TXN-${String(cnt++).padStart(5,"0")}`,date:wDate,sku:p.sku,skuName:p.name,loc,locName,type:"ADJUSTMENT",qty:adj,ref:`ADJ-${cnt}`,sup:null,supName:"",rem:"Cycle count adj."});}
    }
  });
  return txns.sort((a,b)=>b.date.localeCompare(a.date));
}

// ── EXCEPTIONS ────────────────────────────────────────
function buildExceptions(inv,pos){
  const ex=[];
  inv.forEach(p=>{
    if(p.status==="OUT OF STOCK") ex.push({type:"OUT OF STOCK",sev:"CRITICAL",sku:p.sku,name:p.name,cat:p.cat,desc:`${p.name} has zero stock across all warehouses.`,action:"Raise emergency PO immediately. Contact supplier for expedited delivery."});
    else if(p.status==="CRITICAL") ex.push({type:"STOCKOUT RISK",sev:"CRITICAL",sku:p.sku,name:p.name,cat:p.cat,desc:`${p.name} has only ${p.invDays} days of inventory left.`,action:"Initiate emergency replenishment. Escalate to procurement manager."});
    else if(p.status==="LOW STOCK") ex.push({type:"LOW STOCK",sev:"HIGH",sku:p.sku,name:p.name,cat:p.cat,desc:`${p.name}: ${p.qty.toLocaleString("en-IN")} units — below reorder level of ${p.rl}.`,action:"Raise purchase order within 24 hours."});
    else if(p.status==="OVERSTOCKED"){const ex_u=p.qty-p.tgt;ex.push({type:"OVERSTOCK",sev:"MEDIUM",sku:p.sku,name:p.name,cat:p.cat,desc:`${p.name} is overstocked by ${ex_u.toLocaleString("en-IN")} units (₹${(ex_u*p.cost).toLocaleString("en-IN")} excess value).`,action:"Review purchase frequency. Consider promotional pricing or return to supplier."});}
  });
  pos.filter(p=>p.status==="DELAYED").slice(0,10).forEach(p=>ex.push({type:"SUPPLIER DELAY",sev:"HIGH",sku:p.sku,name:p.po,cat:"",desc:`${p.po} from ${p.supName} is delayed by ${p.delay} days (${p.ordered.toLocaleString("en-IN")} units pending).`,action:"Contact supplier for updated ETA. Review alternate sourcing options."}));
  const sevO={CRITICAL:0,HIGH:1,MEDIUM:2};
  return ex.sort((a,b)=>(sevO[a.sev]||3)-(sevO[b.sev]||3));
}

// ── INSIGHTS ──────────────────────────────────────────
function buildInsights(inv,pos,supPerf,abc){
  const ins=[];
  const belowRL=inv.filter(p=>p.qty>0&&p.qty<p.rl).length;
  if(belowRL>0) ins.push({lv:"HIGH",text:`${belowRL} SKUs are currently below reorder level and require immediate procurement action.`});
  const delSups=supPerf.filter(s=>s.delayed>0).sort((a,b)=>b.delayed-a.delayed).slice(0,3);
  const totDel=supPerf.reduce((s,r)=>s+(r.delayed||0),0);
  if(delSups.length&&totDel>0){const top3Del=delSups.reduce((s,r)=>s+r.delayed,0);ins.push({lv:"MEDIUM",text:`${delSups.map(s=>s.name.split(" ").slice(0,2).join(" ")).join(", ")} account for ${Math.round(top3Del/totDel*100)}% of all delayed purchase orders.`});}
  const aI=abc.filter(x=>x.abc==="A");const aV=aI.reduce((s,r)=>s+r.consVal,0);const tV=abc.reduce((s,r)=>s+r.consVal,0);
  ins.push({lv:"INFO",text:`${aI.length} Class-A SKUs account for ${Math.round(aV/tV*100)}% of total consumption value — these require the tightest inventory controls.`});
  const low7=inv.filter(p=>p.invDays>0&&p.invDays<=7).length;
  if(low7>0) ins.push({lv:"HIGH",text:`${low7} SKUs have fewer than 7 days of inventory remaining and face imminent stockout risk.`});
  const totOver=inv.filter(p=>p.status==="OVERSTOCKED").reduce((s,p)=>s+(p.qty-p.tgt)*p.cost,0);
  if(totOver>0) ins.push({lv:"MEDIUM",text:`₹${Math.round(totOver).toLocaleString("en-IN")} of capital is locked in overstocked products — review purchase frequency.`});
  const cats={};inv.forEach(p=>{cats[p.cat]=(cats[p.cat]||0)+p.value;});
  const topCat=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
  const totInvVal=inv.reduce((s,p)=>s+p.value,0);
  if(topCat) ins.push({lv:"INFO",text:`'${topCat[0]}' is the highest-value category, holding ${Math.round(topCat[1]/totInvVal*100)}% of total inventory value.`});
  const poor=supPerf.filter(s=>s.rating==="POOR");
  if(poor.length) ins.push({lv:"HIGH",text:`${poor.map(s=>s.name.split(" ").slice(0,2).join(" ")).join(", ")} ${poor.length===1?"has":"have"} a poor performance score — review contracts and consider alternate suppliers.`});
  return ins;
}

// ── LOCATION STOCK ────────────────────────────────────
function buildLocStock(inv){
  const dist={"WH-DEL":0.35,"WH-MUM":0.30,"WH-BLR":0.15,"WH-KOL":0.12,"WH-HYD":0.08};
  return LOCATIONS.map(l=>({
    ...l,
    units:Math.round(inv.reduce((s,p)=>s+p.qty,0)*dist[l.id]),
    value:Math.round(inv.reduce((s,p)=>s+p.value,0)*dist[l.id]),
    skus:inv.length
  }));
}

// ══ SCORE BAR ══
function SBar({score,max=100}){
  const p=Math.min(score/max*100,100);
  const c=p>=90?"#22c55e":p>=75?"#10e8b8":p>=60?"#f5c518":"#f04438";
  return<div className="score-bar"><div className="score-track"><div className="score-fill" style={{width:p+"%",background:c}}/></div><span className="score-num" style={{color:c}}>{score.toFixed?score.toFixed(1):score}</span></div>;
}

// ══ CHART WRAPPER ══
function CChart({id,cfg,height=210}){
  const ref=useRef();const inst=useRef();
  useEffect(()=>{
    if(!ref.current) return;
    if(inst.current) inst.current.destroy();
    inst.current=new Chart(ref.current,cfg);
    return()=>{if(inst.current){inst.current.destroy();inst.current=null;}};
  },[JSON.stringify(cfg)]);
  return<div className="chart-wrap" style={{height}}><canvas ref={ref}/></div>;
}

// ══ EXPORT CSV ══
function exportCSV(data,name){
  if(!data.length) return;
  const hdrs=Object.keys(data[0]);
  const rows=data.map(r=>hdrs.map(h=>{const v=r[h];return typeof v==="string"&&v.includes(",")?"\""+v+"\"":v??"";}).join(","));
  const csv=[hdrs.join(","),...rows].join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download=`FIIRS_${name}_${TODAY_STR}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

// ══════════════════════════════════════════════════════
//  REPLENISHMENT
// ══════════════════════════════════════════════════════
function Replenishment({inv}){
  const [urgency,setUrgency]=useState("");const [cat,setCat]=useState("");
  const cats=[...new Set(inv.map(p=>p.cat))].sort();
  const needs=inv.filter(p=>p.urgency!=="ADEQUATE");
  const filtered=needs.filter(p=>(!urgency||p.urgency===urgency)&&(!cat||p.cat===cat));
  const urgOrder={"URGENT":0,"REPLENISH NOW":1,"REVIEW":2};
  const sorted=[...filtered].sort((a,b)=>(urgOrder[a.urgency]||3)-(urgOrder[b.urgency]||3)||a.invDays-b.invDays);
  const totalReplVal=sorted.reduce((s,p)=>s+p.replQty*p.cost,0);
  return(
    <div>
      <div className="sh"><span className="sh-t">Replenishment Analysis</span><div className="sh-r"><button className="btn btn-g btn-sm" onClick={()=>exportCSV(sorted.map(p=>({SKU:p.sku,Product:p.name,Category:p.cat,CurrentStock:p.qty,DailyConsumption:p.dc,InvDays:p.invDays,ReorderLevel:p.rl,TargetStock:p.tgt,RecommendedQty:p.replQty,Urgency:p.urgency,Supplier:p.supName})),"Replenishment")}>↓ CSV</button></div></div>
      <div className="info-bar">
        ℹ <strong>Replenishment Formula:</strong> Recommended Qty = Target Stock − Current Stock. Urgency: URGENT (≤3 days), REPLENISH NOW (≤7 days), REVIEW (≤14 days or below reorder). Estimated replenishment value: <strong>{INR(totalReplVal)}</strong>
      </div>
      <div className="kgrid" style={{marginBottom:14}}>
        {[["Urgent",N(needs.filter(p=>p.urgency==="URGENT").length),"var(--red)"],["Replenish Now",N(needs.filter(p=>p.urgency==="REPLENISH NOW").length),"var(--org)"],["Review",N(needs.filter(p=>p.urgency==="REVIEW").length),"var(--yel)"],["Repl. Value",INR(totalReplVal),"var(--ac)"]].map(([l,v,c],i)=>(
          <div key={i} className="kcard" style={{"--kc":c}}><div className="kcard-label">{l}</div><div className="kcard-val" style={{fontSize:v.startsWith("₹")?16:24}}>{v}</div></div>
        ))}
      </div>
      <div className="tw">
        <div className="tw-toolbar">
          <select className="filt filt-sm" value={urgency} onChange={e=>setUrgency(e.target.value)}><option value="">All Urgency</option><option>URGENT</option><option>REPLENISH NOW</option><option>REVIEW</option></select>
          <select className="filt" value={cat} onChange={e=>setCat(e.target.value)}><option value="">All Categories</option>{cats.map(c=><option key={c}>{c}</option>)}</select>
          {(urgency||cat)&&<button className="btn btn-g btn-sm" onClick={()=>{setUrgency("");setCat("");}}>Clear</button>}
          <div className="tw-count">{sorted.length} SKUs</div>
        </div>
        <div className="tw-scroll"><table>
          <thead><tr><th>SKU</th><th>Product</th><th>Category</th><th className="tr">Current Stock</th><th className="tr">Daily Cons.</th><th className="tr">Inv. Days</th><th className="tr">Reorder Lvl</th><th className="tr">Target Stock</th><th className="tr">Recommended Qty</th><th>Urgency</th><th>Supplier</th></tr></thead>
          <tbody>{sorted.length===0?<tr><td colSpan={11}><div className="empty">No replenishment needed ✓</div></td></tr>:
            sorted.map((p,i)=>(
              <tr key={i}>
                <td className="tc col-ac2">{p.sku}</td><td className="bold tnw">{p.name}</td>
                <td><span className="b b-cat">{p.cat}</span></td>
                <td className="tr tc" style={{color:p.qty<p.rl?"var(--red)":"inherit"}}>{N(p.qty)}</td>
                <td className="tr tc">{p.dc}</td>
                <td className="tr tc" style={{color:p.invDays<=3?"var(--red)":p.invDays<=7?"var(--org)":"var(--yel)"}}>{DAYS(p.invDays)}</td>
                <td className="tr tc">{N(p.rl)}</td><td className="tr tc">{N(p.tgt)}</td>
                <td className="tr bold tc col-ac">{N(p.replQty)}</td>
                <td><Bdg v={p.urgency}/></td>
                <td className="col-t3" style={{fontSize:11}}>{p.supName}</td>
              </tr>
            ))
          }</tbody>
        </table></div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
//  STOCKOUT RISK
// ══════════════════════════════════════════════════════
function StockoutRisk({inv}){
  const [risk,setRisk]=useState("");
  const risky=inv.map(p=>{
    const r=p.qty===0?"CRITICAL":p.invDays<=3?"CRITICAL":p.invDays<=7?"HIGH":p.invDays<=14?"MEDIUM":"NORMAL";
    return {...p,risk:r};
  }).filter(p=>p.risk!=="NORMAL");
  const filtered=risky.filter(p=>!risk||p.risk===risk);
  const rOrder={"CRITICAL":0,"HIGH":1,"MEDIUM":2};
  const sorted=[...filtered].sort((a,b)=>(rOrder[a.risk]||3)-(rOrder[b.risk]||3)||a.invDays-b.invDays);
  return(
    <div>
      <div className="sh"><span className="sh-t">Stockout Risk Analysis</span><div className="sh-r"><button className="btn btn-g btn-sm" onClick={()=>exportCSV(sorted.map(p=>({SKU:p.sku,Product:p.name,Category:p.cat,CurrentStock:p.qty,DailyConsumption:p.dc,InvDays:p.invDays,RiskLevel:p.risk,RecommendedQty:p.replQty,Urgency:p.urgency})),"StockoutRisk")}>↓ CSV</button></div></div>
      <div className="info-bar">ℹ Risk thresholds: <strong>CRITICAL</strong> ≤ 3 days &nbsp;|&nbsp; <strong>HIGH</strong> ≤ 7 days &nbsp;|&nbsp; <strong>MEDIUM</strong> ≤ 14 days. All SKUs with NORMAL risk are excluded from this view.</div>
      <div className="kgrid" style={{marginBottom:14}}>
        {[["Critical",N(risky.filter(p=>p.risk==="CRITICAL").length),"var(--red)","≤ 3 days inventory"],["High Risk",N(risky.filter(p=>p.risk==="HIGH").length),"var(--org)","≤ 7 days"],["Medium Risk",N(risky.filter(p=>p.risk==="MEDIUM").length),"var(--yel)","≤ 14 days"]].map(([l,v,c,s],i)=>(
          <div key={i} className="kcard" style={{"--kc":c}}><div className="kcard-label">{l}</div><div className="kcard-val">{v}</div><div className="kcard-sub">{s}</div></div>
        ))}
      </div>
      <div className="tw">
        <div className="tw-toolbar">
          <select className="filt filt-sm" value={risk} onChange={e=>setRisk(e.target.value)}><option value="">All Risk Levels</option><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option></select>
          {risk&&<button className="btn btn-g btn-sm" onClick={()=>setRisk("")}>Clear</button>}
          <div className="tw-count">{sorted.length} SKUs at risk</div>
        </div>
        <div className="tw-scroll"><table>
          <thead><tr><th>SKU</th><th>Product</th><th>Category</th><th className="tr">Current Stock</th><th className="tr">Daily Cons.</th><th className="tr">Inv. Days</th><th>Risk Level</th><th className="tr">Rec. Order Qty</th><th>Urgency</th></tr></thead>
          <tbody>{sorted.length===0?<tr><td colSpan={9}><div className="empty">No stockout risk detected ✓</div></td></tr>:
            sorted.map((p,i)=>(
              <tr key={i}>
                <td className="tc col-ac2">{p.sku}</td><td className="bold tnw">{p.name}</td>
                <td><span className="b b-cat">{p.cat}</span></td>
                <td className="tr tc">{N(p.qty)}</td><td className="tr tc">{p.dc}</td>
                <td className="tr bold tc" style={{color:p.invDays<=3?"var(--red)":p.invDays<=7?"var(--org)":"var(--yel)"}}>{DAYS(p.invDays)}</td>
                <td><Bdg v={p.risk} cls={p.risk==="CRITICAL"?"b-critical":p.risk==="HIGH"?"b-oos":"b-review"}/></td>
                <td className="tr bold tc col-ac">{N(p.replQty)}</td>
                <td><Bdg v={p.urgency}/></td>
              </tr>
            ))
          }</tbody>
        </table></div>
      </div>
    </div>
  );
}

    <div>
      <div className="sh"><span className="sh-t">Slow-Moving & Dead Stock</span><div className="sh-r"><button className="btn btn-g btn-sm" onClick={()=>exportCSV(slow.map(p=>({SKU:p.sku,Product:p.name,Category:p.cat,CurrentStock:p.qty,UnitCost:p.cost,InvValue:p.value,LastMovement:p.lastMoved,DaysSinceMovement:p.daysSince,Status:p.smStatus})),"SlowMoving")}>↓ CSV</button></div></div>

          <div key={i} className="kcard" style={{"--kc":c}}><div className="kcard-label">{l}</div><div className="kcard-val" style={{fontSize:v.startsWith("₹")?16:24}}>{v}</div><div className="kcard-sub">{s}</div></div>
        ))}
      </div>
      <div className="tw"><div className="tw-scroll"><table>
        <thead><tr><th>SKU</th><th>Product</th><th>Brand</th><th>Category</th><th className="tr">Current Stock</th><th className="tr">Unit Cost</th><th className="tr">Inv. Value (₹)</th><th>Last Movement</th><th className="tr">Days Idle</th><th>Status</th></tr></thead>
        <tbody>{slow.length===0?<tr><td colSpan={10}><div className="empty">No slow-moving inventory ✓</div></td></tr>:
          slow.map((p,i)=>(
            <tr key={i}>
              <td className="tc col-ac2">{p.sku}</td><td className="bold tnw">{p.name}</td><td className="col-t3">{p.brand}</td>
              <td><span className="b b-cat">{p.cat}</span></td>
              <td className="tr tc">{N(p.qty)}</td><td className="tr tc">{INR(p.cost)}</td>

              <td><Bdg v={p.smStatus} cls={smCls[p.smStatus]}/></td>
            </tr>
          ))
        }</tbody>
      </table></div></div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
//  OVERSTOCK
// ══════════════════════════════════════════════════════
function Overstock({inv}){
  const over=inv.filter(p=>p.status==="OVERSTOCKED").map(p=>({...p,excessUnits:p.qty-p.tgt,excessVal:(p.qty-p.tgt)*p.cost,ovPct:+((p.qty/p.tgt-1)*100).toFixed(1)})).sort((a,b)=>b.excessVal-a.excessVal);
  const totalExcess=over.reduce((s,p)=>s+p.excessVal,0);
  return(
    <div>
      <div className="sh"><span className="sh-t">Excess Inventory Analysis</span><div className="sh-r"><button className="btn btn-g btn-sm" onClick={()=>exportCSV(over.map(p=>({SKU:p.sku,Product:p.name,Category:p.cat,CurrentStock:p.qty,TargetStock:p.tgt,ExcessUnits:p.excessUnits,OverstockPct:p.ovPct,UnitCost:p.cost,ExcessValue:p.excessVal})),"Overstock")}>↓ CSV</button></div></div>
      <div className="info-bar">ℹ Products where current stock exceeds target stock by more than 80%. Total excess capital: <strong>{INR(totalExcess)}</strong></div>
      <div className="kgrid" style={{marginBottom:14}}>
        {[["Overstocked SKUs",N(over.length),"var(--pur)"],["Total Excess Value",INR(totalExcess),"var(--org)"],["Avg Overstock %",PCT(over.reduce((s,p)=>s+p.ovPct,0)/Math.max(1,over.length)),"var(--yel)"]].map(([l,v,c],i)=>(
          <div key={i} className="kcard" style={{"--kc":c}}><div className="kcard-label">{l}</div><div className="kcard-val" style={{fontSize:v.startsWith("₹")?16:24}}>{v}</div></div>
        ))}
      </div>
      <div className="tw"><div className="tw-scroll"><table>
        <thead><tr><th>SKU</th><th>Product</th><th>Category</th><th className="tr">Current Stock</th><th className="tr">Target Stock</th><th className="tr">Excess Units</th><th className="tr">Overstock %</th><th className="tr">Unit Cost</th><th className="tr">Excess Value (₹)</th><th>Supplier</th></tr></thead>
        <tbody>{over.map((p,i)=>(
          <tr key={i}>
            <td className="tc col-ac2">{p.sku}</td><td className="bold tnw">{p.name}</td>
            <td><span className="b b-cat">{p.cat}</span></td>
            <td className="tr tc">{N(p.qty)}</td><td className="tr tc">{N(p.tgt)}</td>
            <td className="tr bold col-org tc">{N(p.excessUnits)}</td>
            <td className="tr tc col-red">{p.ovPct}%</td>
            <td className="tr tc">{INR(p.cost)}</td>
            <td className="tr bold col-pur">{INR(p.excessVal)}</td>
            <td className="col-t3" style={{fontSize:11}}>{p.supName}</td>
          </tr>
        ))}</tbody>
      </table></div></div>
    </div>
  );
}

function ABCAnalysis({abc}){
  const [cls,setCls]=useState("");

  const a=abc.filter(x=>x.abc==="A"),b=abc.filter(x=>x.abc==="B"),c=abc.filter(x=>x.abc==="C");
  const tV=abc.reduce((s,r)=>s+r.consVal,0);
  const aV=a.reduce((s,r)=>s+r.consVal,0),bV=b.reduce((s,r)=>s+r.consVal,0),cV=c.reduce((s,r)=>s+r.consVal,0);
  return(
    <div>
      <div className="sh"><span className="sh-t">ABC Inventory Classification</span><div className="sh-r"><button className="btn btn-g btn-sm" onClick={()=>exportCSV(abc.map(p=>({SKU:p.sku,Product:p.name,Brand:p.brand,Category:p.cat,UnitCost:p.cost,ConsumedUnits:p.consumed,ConsumptionValue:p.consVal,CumulativePct:p.cumPct,ABCClass:p.abc})),"ABC_Analysis")}>↓ CSV</button></div></div>
      <div className="info-bar">ℹ Based on 6-month consumption value (Daily Consumption × 180 days × Unit Cost). Class A: top 70% of value, Class B: next 20%, Class C: remaining 10%.</div>

          <div className="chart-title">Consumption Value by Class</div>

        </div>
        <div className="chart-box">
          <div className="chart-title">SKU Count by Class</div>
          <CChart id="abc-cnt" height={200} cfg={{type:"doughnut",data:{labels:["Class A","Class B","Class C"],datasets:[{data:[a.length,b.length,c.length],backgroundColor:["#10e8b8","#a855f7","#22c55e"],borderWidth:0}]},options:{...CHART_OPTS,cutout:"60%"}}}/>
        </div>
      </div>

      <div className="tw">
        <div className="tw-toolbar">
          <select className="filt filt-sm" value={cls} onChange={e=>setCls(e.target.value)}><option value="">All Classes</option><option>A</option><option>B</option><option>C</option></select>

        </div>
        <div className="tw-scroll"><table>

            <tr key={i}>
              <td className="tc col-t3">{abc.indexOf(p)+1}</td>

              <td><span className="b b-cat">{p.cat}</span></td>
              <td className="tr tc">{INR(p.cost)}</td><td className="tr tc">{N(p.consumed)}</td>
              <td className="tr bold">{INR(p.consVal)}</td>
              <td className="tr tc">{p.cumPct}%</td>
              <td><Bdg v={p.abc} cls={`b-abc-${p.abc.toLowerCase()}`}/></td>
            </tr>
          ))}</tbody>
        </table></div>
      </div>

    {id:"slow-moving",icon:"🐢",name:"Slow-Moving Inventory Report",desc:"Dead and slow-moving stock with carrying value and recommended disposal actions.",tab:"slow"},
    {id:"supplier",icon:"🏭",name:"Supplier Performance Report",desc:"On-time delivery, fill rate, lead time, and performance score for all suppliers."},
    {id:"abc",icon:"Ⓐ",name:"ABC Analysis Report",desc:"Pareto-based product classification by 6-month consumption value.",tab:"abc"},
    {id:"overstock",icon:"📦",name:"Excess Inventory Report",desc:"Capital tied up in overstocked products with overstock percentage.",tab:"overstock"},
    {id:"movements",icon:"⇄",name:"Inventory Movement Report",desc:"Full transaction register — purchases, sales, transfers, adjustments, and returns.",tab:"movements"},
  ];

  if(view==="executive") return(
    <div>
      <div className="sh"><button className="btn btn-g btn-sm" onClick={()=>setView("catalog")}>← Back to Catalog</button></div>
      <div style={{background:"linear-gradient(135deg,#071a28,var(--bg2))",border:"1px solid var(--bo)",borderRadius:12,padding:"22px 26px",marginBottom:20}}>
        <div style={{fontSize:10,letterSpacing:2,color:"var(--ac)",textTransform:"uppercase",marginBottom:6,fontFamily:"var(--mono)"}}>{COMPANY}</div>
        <div style={{fontSize:22,fontWeight:700,marginBottom:4}}>Executive Inventory Intelligence Report</div>
        <div style={{fontSize:12,color:"var(--t3)"}}>Prepared by FIIRS System &nbsp;·&nbsp; {ds}</div>
      </div>
      <div style={{fontSize:12,fontWeight:700,color:"var(--t2)",letterSpacing:1.5,textTransform:"uppercase",marginBottom:10}}>1. Key Performance Indicators</div>
      <div className="kgrid" style={{marginBottom:20}}>
        {[["Total SKUs",N(kpis.skus),"var(--ac2)"],["Inventory Value",INR(kpis.value),"var(--ac)"],["Out of Stock",N(kpis.oos),"var(--red)"],["Low Stock",N(kpis.low),"var(--yel)"],["Overstocked",N(kpis.over),"var(--pur)"],["Avg Inv. Days",DAYS(kpis.avgInvDays),"var(--green)"]].map(([l,v,c],i)=>(
          <div key={i} className="kcard" style={{"--kc":c}}><div className="kcard-label">{l}</div><div className="kcard-val" style={{fontSize:v.startsWith("₹")?16:24}}>{v}</div></div>
        ))}
      </div>
      <div style={{fontSize:12,fontWeight:700,color:"var(--t2)",letterSpacing:1.5,textTransform:"uppercase",marginBottom:10}}>2. Inventory Value by Category</div>
      <div className="tw" style={{marginBottom:20}}><div className="tw-scroll"><table>
        <thead><tr><th>Category</th><th className="tr">SKUs</th><th className="tr">Units</th><th className="tr">Value (₹)</th><th className="tr">% of Total</th></tr></thead>
        <tbody>{catBreak.map((c,i)=><tr key={i}><td className="bold">{c.cat}</td><td className="tr tc">{N(c.skus)}</td><td className="tr tc">{N(c.units)}</td><td className="tr bold">{INR(c.value)}</td><td className="tr tc">{PCT(c.value/kpis.value*100)}</td></tr>)}</tbody>
      </table></div></div>
      <div style={{fontSize:12,fontWeight:700,color:"var(--t2)",letterSpacing:1.5,textTransform:"uppercase",marginBottom:10}}>3. Key Observations</div>
      <div className="insights-box" style={{marginBottom:20}}><div className="insights-title">Business Intelligence</div>{insights.map((ins,i)=><div key={i} className="insight-row"><div className={`insight-dot id-${ins.lv}`}/><div className="insight-text">{ins.text}</div></div>)}</div>
      <div style={{fontSize:12,fontWeight:700,color:"var(--t2)",letterSpacing:1.5,textTransform:"uppercase",marginBottom:10}}>4. Critical Exceptions</div>
      <div className="tw">{exceptions.filter(e=>e.sev==="CRITICAL").map((e,i)=><div key={i} className="ex-item"><div className={`ex-bar ex-bar-${e.sev}`}/><div><div className="ex-type">{e.type}</div><div className="ex-desc">{e.desc}</div><div className="ex-action">→ {e.action}</div></div></div>)}{exceptions.filter(e=>e.sev==="CRITICAL").length===0&&<div className="empty">No critical exceptions</div>}</div>
      <div style={{marginTop:16,padding:"12px 14px",background:"rgba(78,88,112,.1)",borderRadius:8,fontSize:11,color:"var(--t3)"}}>⚠️ <strong>Disclaimer:</strong> This report is generated from the FIIRS synthetic dataset for portfolio demonstration purposes. All company names, products, suppliers and financial figures are fictional.</div>
    </div>
  );

  if(view==="supplier") return(
    <div>
      <div className="sh"><button className="btn btn-g btn-sm" onClick={()=>setView("catalog")}>← Back</button></div>
      <div style={{background:"linear-gradient(135deg,#071a28,var(--bg2))",border:"1px solid var(--bo)",borderRadius:12,padding:"22px 26px",marginBottom:20}}>
        <div style={{fontSize:10,letterSpacing:2,color:"var(--ac)",textTransform:"uppercase",marginBottom:6,fontFamily:"var(--mono)"}}>{COMPANY}</div>
        <div style={{fontSize:22,fontWeight:700,marginBottom:4}}>Supplier Performance Report</div>
        <div style={{fontSize:12,color:"var(--t3)"}}>{ds}</div>
      </div>
      <div className="kgrid" style={{marginBottom:16}}>
        {[["Suppliers Evaluated",N(supPerf.length),"var(--ac2)"],["Avg On-Time %",PCT(supPerf.reduce((s,r)=>s+r.onTimePct,0)/supPerf.length),"var(--ac)"],["Avg Fill Rate",PCT(supPerf.reduce((s,r)=>s+r.fillRate,0)/supPerf.length),"var(--green)"],["Poor Performers",N(supPerf.filter(s=>s.rating==="POOR").length),"var(--red)"]].map(([l,v,c],i)=>(
          <div key={i} className="kcard" style={{"--kc":c}}><div className="kcard-label">{l}</div><div className="kcard-val" style={{fontSize:v.includes("%")||v.startsWith("₹")?18:24}}>{v}</div></div>
        ))}
      </div>
      <div className="tw"><div className="tw-scroll"><table>
        <thead><tr><th>#</th><th>Supplier</th><th>City</th><th className="tr">Total POs</th><th className="tr">Received</th><th className="tr">Delayed</th><th className="tr">On-Time %</th><th className="tr">Fill Rate %</th><th className="tr">Avg Lead</th><th>Score</th><th>Rating</th></tr></thead>
        <tbody>{[...supPerf].sort((a,b)=>b.score-a.score).map((s,i)=><tr key={i}><td className="tc col-t3">{i+1}</td><td className="bold">{s.name}</td><td className="col-t3">{s.city}</td><td className="tr tc">{N(s.total)}</td><td className="tr tc col-grn">{N(s.received)}</td><td className="tr tc" style={{color:(s.delayed||0)>0?"var(--red)":"var(--t3)"}}>{N(s.delayed||0)}</td><td className="tr tc">{PCT(s.onTimePct)}</td><td className="tr tc">{PCT(s.fillRate)}</td><td className="tr tc">{s.avgLead}d</td><td style={{minWidth:110}}><SBar score={s.score}/></td><td><Bdg v={s.rating}/></td></tr>)}</tbody>
      </table></div></div>
    </div>
  );

  return(
    <div>
      <div className="sh"><span className="sh-t">Report Catalog</span></div>
      <div className="report-grid">
        {REPORTS.map((r,i)=>(
          <div key={i} className="report-card" onClick={()=>r.tab?setTab(r.tab):setView(r.id)}>
            <div className="rep-icon">{r.icon}</div>
            <div className="rep-name">{r.name}</div>
            <div className="rep-desc">{r.desc}</div>
            <div className="rep-actions">
              <button className="btn btn-p btn-sm" onClick={e=>{e.stopPropagation();r.tab?setTab(r.tab):setView(r.id);}}>View Report</button>
              <button className="btn btn-g btn-sm" onClick={e=>{e.stopPropagation();
                if(r.id==="executive"||r.id==="supplier"||r.id==="abc") exportCSV(abc.map(p=>({SKU:p.sku,Name:p.name,ConsumptionValue:p.consVal,ABC:p.abc})),r.name.replace(/\s+/g,"_"));
                else if(r.id==="replenishment") exportCSV(inv.filter(p=>p.urgency!=="ADEQUATE").map(p=>({SKU:p.sku,Product:p.name,CurrentStock:p.qty,InvDays:p.invDays,RecQty:p.replQty,Urgency:p.urgency})),"Replenishment");
              }}>↓ CSV</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════
//  MOUNT
// ══════════════════════════════════════════════════════
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
